<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">XU — Native code. Clear intent.</title>
  <desc id="desc">The XU programming language. Native AOT compilation, zero GC, and built-in concurrency. Cinnabar lettering and the XU oracle emblem on an obsidian grid.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FAF9F6" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="#0B0A0F"/>
  <rect width="1280" height="304" fill="url(#grid)"/>
  <path d="M0 0H1280" stroke="#FF385C" stroke-width="8"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" fill="#A8A29E">
    <text x="56" y="51" font-size="14" letter-spacing="2">THE XU PROGRAMMING LANGUAGE</text>
    <text x="1224" y="51" text-anchor="end" font-size="14">xulang.org</text>
  </g>
  <text x="50" y="181" font-family="'Arial Black', 'Helvetica Neue', Helvetica, sans-serif" font-size="132" font-weight="900" letter-spacing="-7" fill="#FF385C">XU</text>
  <text x="56" y="251" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="-1.2" fill="#FAF9F6">Native code. Clear intent.</text>
  <path d="M792 88V264" stroke="#343039"/>
  <g transform="translate(1010 177) scale(.72) translate(-250 -255)" fill="none" stroke="#FF385C" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M105 140L90 295L250 370L410 295L395 140"/>
    <path d="M165 155L230 218L165 280"/>
    <path d="M335 155L270 218L335 280"/>
  </g>
  <path d="M56 304H1224" stroke="#343039"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#D6D3D1">
    <text x="56" y="338"><tspan fill="#FF385C">01 /</tspan> NATIVE AOT</text>
    <text x="430" y="338"><tspan fill="#FF385C">02 /</tspan> ZERO GC</text>
    <text x="804" y="338"><tspan fill="#FF385C">03 /</tspan> BUILT-IN CONCURRENCY</text>
  </g>
</svg>
