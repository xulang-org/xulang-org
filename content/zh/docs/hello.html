<h1>Hello</h1>
<p>可执行包第一行 <code>@main</code>。入口 <code>fn main() int</code>（返回值作退出码）或 <code>fn main()</code>。依赖行首 <code>#路径</code>，包名是路径最后一段。</p>
<pre><code>@main

#errors

fn main() int {
    println("hello")
    &lt;&lt; 0
}</code></pre>
<pre><code>xu build hello.xu
./hello</code></pre>
<p>目录模式：<code>xu build .</code> 编当前目录全部 <code>*.xu</code>（不递归）。<code>xu run hello.xu</code> 编并运行当前文件，仅本机 target。</p>
