<p class='crumb'><a href='/docs/start'>文档</a> / 语言</p><h1>并发</h1>
<pre><code>fn worker(id int, ch chan int) {
    ch &lt;- id * 10
}

fn main() int {
    ch := chan int{cap: 1}
    xu worker(1, ch)
    println(&lt;-ch)
    &lt;&lt; 0
}</code></pre>
<p><code>xu f(args)</code> 启动协程。<code>xu.pkg.f</code> 用于包限定函数调用。Channel 转移所有权；不要把借用送进协程。已有缓冲/无缓冲、<code>close</code>、<code>select</code>。</p>
