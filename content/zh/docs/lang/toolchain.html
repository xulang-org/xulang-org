<p class='crumb'><a href='/docs/start'>文档</a> / 语言</p><h1>工具链</h1>
<p>语言体验绑在这些产品命令上：<code>build</code> <code>run</code> <code>check</code> <code>test</code> <code>fmt</code> <code>map</code> <code>doctor</code> <code>up</code>。</p>
<p>默认编本机。交叉：<code>--target linux-arm64</code> 或 <code>XUOS</code> / <code>XUARCH</code>。<code>XUPATH</code> 在 Unix 用 <code>:</code>，Windows 用 <code>;</code>（按宿主机，与 target 无关）。</p>
<p><code>--shared</code> 导出类型仅限 <code>int</code> / <code>bool</code> / <code>string</code> / <code>f64</code> / <code>i32</code> / <code>u32</code> / <code>u8</code>。独立 AOT：不依赖外部工具链是硬约束。</p>
