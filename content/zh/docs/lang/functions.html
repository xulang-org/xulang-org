<p class='crumb'><a href='/docs/start'>文档</a> / 语言</p><h1>函数与表达式</h1>
<pre><code>fn add(a int, b int) int {
    &lt;&lt; a + b
}

fn (c &amp;mut Counter) inc() {
    c.n += 1
}</code></pre>
<p>可变参写末位 <code>name &lt;-&gt; T</code>，体内是 <code>[]T</code>。错误不要多返回值，走 <code>&gt;&gt;</code> + <code>or</code>。</p>
<p>运算符：表达式里 <code>&lt;&lt;</code> <code>&gt;&gt;</code> 仍是移位；写成语句才是返回/抛错。布尔或用 <code>||</code>；<code>or</code> 只接错误。除零运行时 fail-loud。索引越界同样 fail-loud。</p>
