<h1>Структура программы</h1>
<p>Каталог образует пакет: директива <code>#util</code> загружает файлы <code>util/*.xu</code>.</p>
<p>Точка входа программы объявляется аннотацией <code>@main</code> перед функцией <code>fn main() int</code>.</p>
<p>Пакеты импортируются через символ решётки: <code>#fmt</code>, <code>#net/http</code>, <code>#crypto/aes</code>.</p>
