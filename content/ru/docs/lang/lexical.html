<h1>Лексика</h1>
<p>Файлы с расширением <code>.xu</code> кодируются в UTF-8. Комментарии: строчные <code>//</code> и блочные <code>/* ... */</code>.</p>
<p>Идентификаторы начинаются с буквы ASCII или подчеркивания. Ключевые слова включают <code>fn</code>, <code>struct</code>, <code>enum</code>, <code>if</code>, <code>else</code>, <code>for</code>, <code>in</code>, <code>match</code>, <code>xu</code>, <code>chan</code>, <code>const</code>.</p>
