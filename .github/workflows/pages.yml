name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test static site
        run: make check
      - name: Checkout Xu playground sources
        uses: actions/checkout@v6
        with:
          repository: xulang-org/bootstrap
          ref: f8ac5d2f376680b8e10eab5d5a1cd216e3d84963
          path: build/playground-source
          persist-credentials: false
      - name: Install Rust WASM target
        run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - name: Build Xu playground
        env:
          RUSTUP_TOOLCHAIN: '1.92.0'
          XU_BOOTSTRAP_ROOT: ${{ github.workspace }}/build/playground-source
        run: ./scripts/build-playground.sh
      - name: Test Xu playground execution
        run: make check-playground
      - name: Read Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/build-static.py --base-path "$BASE_PATH" --require-playground
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
