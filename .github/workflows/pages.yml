name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test static site
        run: make check
      - name: Resolve the final release matching Xu main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve-xu-release.py --github-env "$GITHUB_ENV"
      - name: Install WASM-capable Xu SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/xu-sdk
          gh release download "v$XU_RELEASE_VERSION" --repo xulang-org/xu \
            --pattern "$XU_SDK_ARCHIVE" --dir build/xu-sdk
          cd build/xu-sdk
          printf '%s  %s\n' "$XU_SDK_SHA256" "$XU_SDK_ARCHIVE" | sha256sum --check
          tar -xzf "$XU_SDK_ARCHIVE"
          test "$(cat "xu-v$XU_RELEASE_VERSION/VERSION")" = "$XU_RELEASE_VERSION"
          echo "XU_ROOT=$GITHUB_WORKSPACE/build/xu-sdk/xu-v$XU_RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Generate API from the same released SDK
        run: make api XU_PACKAGES_ROOT="$XU_ROOT/packages"
      - name: Compile playground runtime with Xu
        run: ./scripts/build-playground.sh
      - name: Test Xu playground execution
        run: make check-playground
      - name: Read Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/build-static.py --base-path "$BASE_PATH" --xu-version "$XU_RELEASE_VERSION" --require-playground
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
