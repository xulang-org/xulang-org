<p class="lead">用于搜索、比较及重新排列切片的算法。</p>
<h2>切片内置方法 · 开发预览</h2>
<p>以下方法适用于 Xu 0.14.0 之后的开发版。可直接在可变动态切片上调用，也可通过可写借用调用。</p>
<h3 id="reserve"><code>slice.reserve(n int)</code></h3>
<p>确保容量至少为 <code>n</code> 个元素，保留原有长度和元素值。<code>n</code> 为所需的总容量，请传入非负整数。</p>
<h3 id="resize_zero"><code>slice.resize_zero(n int)</code></h3>
<p>将切片长度设为 <code>n</code>。增长时保留已有元素，新增元素初始化为零值。缩短时保留容量和前 <code>n</code> 个元素。传入负数时切片保持原状。元素类型限于整数、浮点数和布尔值。相关接口见<a href="/docs/ai#api">本地推理指南</a>。</p>
