<h2 id="typed-list-migration">0.11.4 解析与序列化</h2>
<p>带类型的块列表继承其标量类型，逐项验证，并在序列化时保留容器和元素标签。可安全表示的同类型非字符串列表可使用紧凑输出；字符串列表保留块形式。序列化拼写可能变化，请更新文本快照；若拼写不是契约的一部分，可比较解析树。旧的非空 <code>!s[...]</code> 标量输入仍被接受。</p>
<p>根以下容器的嵌套受 <code>MAX_DEPTH</code>（64）限制，包含行内、空容器和带类型容器。duration 校验拒绝格式错误或缺少单位的输入，并持续推进解析位置。多行解析将结构缩进与正文空白分别处理。</p>
