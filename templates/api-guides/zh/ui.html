<p>窗口、事件、结构化菜单、屏幕和异步桌面服务。一个 worker 消费 App.event_ch；用 window_id / canvas_id / generation 校验目标。ev_request 经 request_of 解码，使用 RequestResult.matches 与请求匹配；处理 completed、cancelled、failed、unsupported 和 timed_out。屏幕坐标与画布坐标不可混用。</p>
