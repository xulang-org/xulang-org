<p>约束、尺寸、矩形、row / column / stack / padding 与保留布局树。父约束向下传递，子尺寸向上返回。BoxStyle 的 width / height=-1 代表自然尺寸。树最多 4096 节点、深度 64；删除后的节点 ID 不复用。View 在 widgets 中负责绘制与输入。</p>
