<p>显式 Context / Frame 绘图，支持路径、渐变、文字、图像、DisplayList、Surface 和缓存。画布默认不平移；set_pan_enabled(1) 显式启用相机。Frame.scale 使用比例，包级 scale 使用百分比。push / pop 必须配对；资源活到 present / freeze / snapshot 接受后再释放。</p>
