<h2>协议基础组件与设备职责</h2>
<p>本包提供有界信标解析、AP 选择、关联及受限的 PSK/CCMP pairwise 握手。它负责构造协议消息、验证接收字节；控制器事件循环、密钥安装、重放计数器和报文所有权由应用维护。解析 DMA 数据前须确认硬件完成状态与 RX 状态。</p>
<p><a href="/api/embedded/wifi/key_data">key_data</a> 负责包装密钥数据验证，<a href="/api/embedded/wifi/ccmp">ccmp</a> 处理认证保护帧，<a href="/api/embedded/wifi/ipv4">ipv4</a> 提供 DHCP/ARP/ICMP 获取探针。标准 <code>WifiDevice</code> 操作仍返回未接入；持久站点服务、租约续期、DNS/TCP、WPA3/PMF 与 BLE/Wi-Fi 共存仍需后续实现。</p>
