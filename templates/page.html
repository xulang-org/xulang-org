<!doctype html>
<html lang="$lang" data-theme="light">
<head>
  <meta charset="utf-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MJRCSYL8PS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-MJRCSYL8PS');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$meta_description">
  <meta name="keywords" content="$meta_keywords">
  <link rel="canonical" href="$canonical_url">
  <link rel="alternate" hreflang="zh-CN" href="$url_zh">
  <link rel="alternate" hreflang="en" href="$url_en">
  <link rel="alternate" hreflang="x-default" href="$url_en">
  <meta property="og:type" content="$og_type">
  <meta property="og:site_name" content="Xu Programming Language">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$meta_description">
  <meta property="og:url" content="$canonical_url">
  <meta property="og:image" content="https://xulang.org/xu_classic.svg">
  <meta property="og:locale" content="$og_locale">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@xulang_org">
  <meta name="twitter:creator" content="@xulang_org">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$meta_description">
  <meta name="twitter:image" content="https://xulang.org/xu_classic.svg">
  $schema_json_ld
  <link rel="icon" href="/xu_classic.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/xu-icons.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="preload" href="/xu-play.wasm" as="fetch" type="application/wasm" crossorigin>
  <script>
    // Redirect simplified-Chinese browsers to /zh/ when visiting the bare homepage.
    (function () {
      var p = window.location.pathname.replace(/\/+$$/, '') || '/';
      if (p === '/' && /^zh(-cn|-hans)?(\b|$$)/i.test(navigator.language || '')) {
        window.location.replace('/zh/');
      }
    }());
  </script>
  <script src="/theme.js"></script>
  <script src="/xu-play-canvas.js" defer></script>
  <script src="/xu-play.js" defer></script>
</head>
<body>
  <header class="header-bar">
    <div class="header-inner">
      <a class="brand-wrapper" href="$home" title="$home_title">
        <img src="/xu_classic.svg" width="34" height="34" alt="XU" class="brand-logo-img">
        <span class="brand-title">XU<span class="badge">v$xu_version</span></span>
      </a>
      <nav class="nav-tabs" id="site-nav" aria-label="$nav_label">$nav</nav>
      <div class="header-controls">
        <nav class="header-social" aria-label="$social_label">$header_social</nav>
        <a class="icon-btn" href="$other_lang" hreflang="$other_lang_code" lang="$other_lang_code" title="$lang_title" aria-label="$lang_title">$lang_label</a>
        <button type="button" class="icon-btn" id="theme-toggle-btn" title="$theme_label"><i class="xi xi-moon"></i> <span>Dark</span></button>
        <button type="button" class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="$menu_label" aria-expanded="false" title="$menu_label"><i class="xi xi-menu"></i></button>
      </div>
    </div>
  </header>
  <div class="mobile-nav-scrim" id="mobile-nav-scrim"></div>
  $main
  <footer class="site">
    <nav class="footer-social" aria-label="$social_label">$footer_social</nav>
    <p><i class="xi xi-logo xi-brand"></i> XU v$xu_version · $footer_text · <a href="$ui_href"><i class="xi xi-palette"></i> UI / WebView</a> · <a href="/fonts/demo.html"><i class="xi xi-code"></i> XuIcons</a></p>
  </footer>
</body>
</html>
