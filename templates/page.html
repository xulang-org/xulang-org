<!doctype html>
<html lang="$lang" data-theme="light">
<head>
  <meta charset="utf-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MJRCSYL8PS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-MJRCSYL8PS');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$meta_description">
  <meta name="keywords" content="$meta_keywords">
  <link rel="canonical" href="$canonical_url">
  $alternate_links
  <meta property="og:type" content="$og_type">
  <meta property="og:site_name" content="Xu Programming Language">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$meta_description">
  <meta property="og:url" content="$canonical_url">
  <meta property="og:image" content="https://xulang.org/xu_classic.svg">
  <meta property="og:locale" content="$og_locale">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@xulang_org">
  <meta name="twitter:creator" content="@xulang_org">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$meta_description">
  <meta name="twitter:image" content="https://xulang.org/xu_classic.svg">
  $schema_json_ld
  <link rel="alternate" type="text/markdown" href="/llms.txt" title="LLM Context">
  <link rel="alternate" type="text/plain" href="/llms.txt" title="Plaintext Documentation">
  <link rel="icon" href="/xu_classic.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/xu-icons.css">
  <link rel="stylesheet" href="/site.css">
  $page_assets
  <script src="/theme.js"></script>
  $playground_assets
</head>
<body>
  <header class="header-bar">
    <div class="header-inner">
      <a class="brand-wrapper" href="$home" title="$home_title">
        <img src="/xu_classic.svg" width="34" height="34" alt="XU" class="brand-logo-img">
        <span class="brand-title">XU$version_badge</span>
      </a>
      <nav class="nav-tabs" id="site-nav" aria-label="$nav_label">$nav</nav>
      <div class="header-controls">
        <nav class="header-social" aria-label="$social_label">$header_social</nav>
        <button type="button" class="nav-search-btn" id="global-search-btn" aria-label="$search_label" title="$search_label (Ctrl+K / ⌘K)"><i class="xi xi-search" aria-hidden="true"></i> <span class="nav-search-label">$search_label</span><kbd class="nav-search-kbd">⌘K</kbd></button>
        <div class="lang-switch-wrap" id="lang-switch-wrap">
          <a class="icon-btn" id="language-switch" href="$other_lang" hreflang="$other_lang_code" lang="$other_lang_code" title="$lang_title" aria-label="$lang_title">$lang_label</a>
          <div class="lang-dropdown" id="lang-dropdown">
            <a href="$url_en_rel" hreflang="en" lang="en" class="lang-opt$active_en">English</a>
            <a href="$url_zh_rel" hreflang="zh-CN" lang="zh-CN" class="lang-opt$active_zh">简体中文</a>
            <a href="$url_zh_tw_rel" hreflang="zh-TW" lang="zh-TW" class="lang-opt$active_zh_tw">繁體中文</a>
            <a href="$url_ja_rel" hreflang="ja" lang="ja" class="lang-opt$active_ja">日本語</a>
            <a href="$url_ko_rel" hreflang="ko" lang="ko" class="lang-opt$active_ko">한국어</a>
            <a href="$url_es_rel" hreflang="es" lang="es" class="lang-opt$active_es">Español</a>
            <a href="$url_fr_rel" hreflang="fr" lang="fr" class="lang-opt$active_fr">Français</a>
            <a href="$url_de_rel" hreflang="de" lang="de" class="lang-opt$active_de">Deutsch</a>
            <a href="$url_ru_rel" hreflang="ru" lang="ru" class="lang-opt$active_ru">Русский</a>
            <a href="$url_pt_br_rel" hreflang="pt-BR" lang="pt-BR" class="lang-opt$active_pt_br">Português</a>
          </div>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle-btn" title="$theme_label"><i class="xi xi-moon"></i> <span>Dark</span></button>
        <button type="button" class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="$menu_label" aria-expanded="false" title="$menu_label"><i class="xi xi-menu"></i></button>
      </div>
    </div>
  </header>
  <div class="mobile-nav-scrim" id="mobile-nav-scrim"></div>
  $main
  <footer class="site">
    <nav class="footer-social" aria-label="$social_label">$footer_social</nav>
    <p><i class="xi xi-logo xi-brand"></i> $footer_identity · $footer_text · <a href="$ui_href"><i class="xi xi-palette"></i> UI / WebView</a> · <a href="/fonts/demo.html"><i class="xi xi-code"></i> XuIcons</a></p>
  </footer>
</body>
</html>
