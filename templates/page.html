<!doctype html>
<html lang="$lang" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <link rel="icon" href="/xu_classic.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/xu-icons.css">
  <link rel="stylesheet" href="/site.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header class="header-bar">
    <a class="brand-wrapper" href="$home">
      <img src="/xu_classic.svg" width="34" height="34" alt="XU" class="brand-logo-img">
      <span class="brand-title">XU<span class="badge">v$xu_version</span></span>
    </a>
    <nav class="nav-tabs">$nav</nav>
    <div class="header-controls">
      <a class="icon-btn" href="$other_lang" title="$lang_title">$lang_label</a>
      <button type="button" class="icon-btn" id="theme-toggle-btn" title="$theme_label"><i class="xi xi-moon"></i> <span>Dark</span></button>
    </div>
  </header>
  $main
  <footer class="site"><p><i class="xi xi-logo xi-brand"></i> XU v$xu_version · $footer_text · <a href="$ui_href"><i class="xi xi-palette"></i> UI / WebView</a> · <a href="/fonts/demo.html"><i class="xi xi-code"></i> XuIcons</a></p></footer>
</body>
</html>
